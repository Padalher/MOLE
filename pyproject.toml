[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mole-viewer"
description = "Lightweight molecular viewer for XYZ, Gaussian, ORCA and cube files, with an interactive E vs n plot; fluid over SSH/X11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pablo Daniel Álvarez Hernández", email = "pablo.alvarez@padalher.com" },
    { name = "Filiberto Ortiz Chi", email = "filiberto.ortiz@cinvestav.mx" },
]
requires-python = ">=3.6"
keywords = ["chemistry", "computational-chemistry", "molecular-visualization", "xyz", "orca", "gaussian", "x11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Padalher/MOLE"
Issues = "https://github.com/Padalher/MOLE/issues"
Changelog = "https://github.com/Padalher/MOLE/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/mole/Cargo.toml"
