# Packages the `mole` executable as a Python wheel (maturin, bindings = "bin"): `pip install mole-viewer`
# puts `mole` on the environment's PATH. There is no Python code.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mole-viewer"
description = "Lightweight viewer for ensembles of molecular structures with an interactive E vs n plot, fast over SSH/X11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pablo D. Alvarez-Hernandez" },
    { name = "Filiberto Ortiz Chi" },
]
requires-python = ">=3.8"
keywords = ["chemistry", "computational-chemistry", "molecular-visualization", "xyz", "orca", "gaussian", "x11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Padalher/MOLE"
Issues = "https://github.com/Padalher/MOLE/issues"
Changelog = "https://github.com/Padalher/MOLE/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/mole/Cargo.toml"
